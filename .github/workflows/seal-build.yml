name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The published 1.5.8 jar manifest records Build-Jdk 1.8.0_172 and
      # Created-By Apache Maven 3.5.3: JDK 8 compiling with source/target 1.7.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Maven 3.5.3
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.5.3/binaries/apache-maven-3.5.3-bin.tar.gz -o "$RUNNER_TEMP/maven.tgz"
          tar -xzf "$RUNNER_TEMP/maven.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.5.3/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          java -version
          mvn -v

      - name: Build and test
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B -e clean package -Dmaven.javadoc.skip=true -Dtest='${{ inputs.test-filter }}' -DfailIfNoTests=false
          else
            mvn -B -e clean package -Dmaven.javadoc.skip=true
          fi

      - name: Test report
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          tot = fail = err = skip = 0
          for f in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              r = ET.parse(f).getroot()
              t, fl, e, s = (int(r.get(k, 0)) for k in ('tests', 'failures', 'errors', 'skipped'))
              tot += t; fail += fl; err += e; skip += s
              print(f"{r.get('name')}: tests={t} failures={fl} errors={e} skipped={s}")
              for tc in r.findall('testcase'):
                  status = 'PASS'
                  for tag in ('failure', 'error', 'skipped'):
                      el = tc.find(tag)
                      if el is not None:
                          status = f"{tag.upper()}: {el.get('message')}"
                  print(f"  {tc.get('classname')}.{tc.get('name')} ... {status}")
          print(f"TOTAL tests={tot} passed={tot-fail-err-skip} failures={fail} errors={err} skipped={skip}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: antisamy-jar
          path: target/antisamy-1.5.8.jar
          if-no-files-found: error
